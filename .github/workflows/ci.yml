name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell and parser checks (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: bash -n mail-sec-audit.sh tests/*.sh

      - name: Smoke tests (CLI contract through the wrapper)
        run: bash tests/smoke.sh

      - name: Wrapper checks
        run: bash tests/wrapper.sh

      - name: Full audit on the runner (json and json-v1)
        run: bash tests/full_json.sh

      - name: ShellCheck
        run: shellcheck mail-sec-audit.sh tests/*.sh

  python:
    name: Python ${{ matrix.python }} unit and scenario tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10"]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and scenario tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v

      - name: Build zipapp
        run: python tools/build_zipapp.py dist/mail-sec-audit.pyz && python -I dist/mail-sec-audit.pyz --version

      - name: Run the zipapp audit
        run: |
          set +e
          python -I dist/mail-sec-audit.pyz --days 1 --format json > /tmp/report.json
          status=$?
          set -e
          test "$status" -le 2
          python -c 'import json; d = json.load(open("/tmp/report.json")); assert d["schema_version"] == "1.0"'

  lint:
    name: ruff and mypy --strict
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check "ruff==0.17.3" "mypy==2.4.1"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check mail_sec_audit tests tools

      - name: mypy --strict
        run: mypy

  container:
    name: Ubuntu 22.04 container without gawk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ubuntu:22.04

    steps:
      - name: Install system Python only
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 ca-certificates openssl
          if command -v gawk; then echo "gawk must not be installed" >&2; exit 1; fi
          python3 --version

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Unit and scenario tests with the system Python
        run: python3 -m unittest discover -s tests -t .

      - name: Smoke tests through the wrapper without gawk
        run: bash tests/smoke.sh
