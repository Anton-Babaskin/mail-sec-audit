name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell and parser checks (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: bash -n mail-sec-audit.sh

      - name: Python syntax
        run: python3 -m py_compile lib/mail_stats.py

      - name: Smoke tests
        run: bash tests/smoke.sh

      - name: Full JSON audit
        run: bash tests/full_json.sh

      - name: ShellCheck
        run: shellcheck mail-sec-audit.sh tests/*.sh
